name: Build & Release APK

# - 브랜치 push / 수동 실행: release APK 빌드만 확인 (서명 키가 등록돼 있으면 서명된 APK를 Artifact로 올림)
# - v1.2.3 형식 태그 push: 서명된 APK를 빌드해서 GitHub Release로 배포
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret이 없어서 서명된 릴리스를 만들 수 없습니다."
            exit 1
          else
            echo "::notice::서명 키 secret이 없어서 서명되지 않은 APK로 빌드만 확인합니다."
          fi

      - name: Compute version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::태그는 v1.2.3 형식이어야 합니다 (minor/patch는 0~99): $GITHUB_REF_NAME"
            exit 1
          fi
          # v1.2.3 -> 10203. 업데이트가 설치되려면 versionCode가 항상 커져야 합니다.
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "VERSION_ARGS=-PappVersionName=$version -PappVersionCode=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=BarleysMusicPlayer-$version.apk" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease $VERSION_ARGS

      - name: Collect APK
        id: apk
        run: |
          dir=app/build/outputs/apk/release
          if [ -f "$dir/app-release.apk" ]; then
            name="${APK_NAME:-BarleysMusicPlayer-${GITHUB_SHA::7}.apk}"
            cp "$dir/app-release.apk" "$name"
            echo "path=$name" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::서명된 APK가 없습니다. 서명 secret 4개가 모두 등록됐는지 확인하세요."
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.apk.outputs.path != '' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
